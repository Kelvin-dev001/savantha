  link: { label: All services, href: /services }
  countLabel: { one: service, many: services }
  open: Explore

# 03 — How we work. Pinned on desktop; stacked below 1024 px and under reduced motion.
process:
  label: How we work
  heading: Four steps. The same for every client.
  lead: >-
    Whether the question is a household budget or a letter of credit, the method does not
    change. You always know which step we are on, and what you will have at the end of it.
  outcomeLabel: You leave with
  stepLabel: Step
  steps:
    - title: Listen
      body: >-
        We start with your situation, not with a product. Income, obligations, family,
        business and faith: what matters to you, in your own words. We ask before we suggest.
      outcome: A short written summary of where you stand, checked with you.
    - title: Analyse
      body: >-
        We work through the numbers and the options together: cash flow, debt, cover and
        assets, and the risks attached to each choice, so you understand them before you commit.
      outcome: A clear view of your options, and what each one costs and risks.
    - title: Structure
      body: >-
        We set out a written plan: what to do, in what order, at what cost and with whom.
        Where regulated investment advice is needed, we refer you to a CMA-licensed adviser.
      outcome: A written plan, with every fee, product and risk explained.
    - title: Review
      body: >-
        Lives and businesses change, so plans should too. We meet at agreed intervals, check
        progress against the plan and adjust it when your circumstances move.
      outcome: Scheduled reviews, and a plan that stays current.

# 04 — Why Savantho. The four values as ledger rows, one line of proof each.
values:
  label: Why Savantho
  heading: What you can hold us to.
  lead: >-
    Values are easy to print. These are the ones we expect to be judged on, each with the
    practice that proves it.
  rows:
    - value: Integrity
      proof: We explain every fee, product and risk in writing, before you commit to anything.
    - value: Resilience
      proof: We plan for a hard year, not only a good one. A reserve comes before anything else.
    - value: Innovation
      proof: Modern tools, explained plainly, so you can see your own finances and stay in control.
    - value: Legacy
      proof: We plan past the next decade, to who inherits what and how, alongside your advocate.
  total:
    label: In short
    text: No surprises. Everything in writing.

