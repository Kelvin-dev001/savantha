# 01 — Who we help. The heading is one sentence; each audience phrase carries a footnote
# number, and the footnotes below expand on it.
audiences:
  label: Who we help
  sentence:
    - text: 'We work with '
    - text: families and professionals
      note: 1
    - text: ' building something to pass on, '
    - text: businesses
      note: 2
    - text: ' moving goods across borders, and '
    - text: organisations
      note: 3
    - text: ' investing in people.'
  askingLabel: Often the first question
  items:
    - title: Families and professionals
      question: Where does our money actually go, and what should come first?
      body: >-
        Salaried professionals, business owners and families who want a plan that holds: a
        budget that survives a bad month, savings with a purpose, property bought with open
        eyes, and wealth arranged on ethical or Shariah-conscious terms.
      services: [wealth-planning, shariah-compliant-finance, real-estate]
    - title: SMEs and importers
      question: How do we pay a new supplier without tying up all our cash?
      body: >-
        Traders, importers and growing companies who need the finance behind a shipment or a
        contract to be clear before they sign: what it costs, who carries the risk, and what
        the bank will ask for.
      services: [trade-finance]
    - title: Organisations and programmes
      question: How do we build real financial capability, and show that it worked?
      body: >-
        Employers, SACCOs, NGOs and donor-funded programmes that want financial literacy
        training people actually use, and monitoring and evaluation that tells them what a
        programme achieved.
      services: [financial-literacy, project-me]

# 02 — Three pillars. Pillar names, lines and services come from src/config/navigation.ts.
