# 07 — FAQ teaser. Answer first, 40–60 words each.
faq:
  label: Questions
  heading: Asked plainly, answered plainly.
  link: { label: All questions, href: /faq }
  items:
    - q: What does the first conversation cost?
      a: >-
        Nothing. The discovery call is free and takes about 20 minutes. We listen, ask a few
        questions and tell you honestly whether we can help. If we can, we send a written
        proposal with the scope, the fees and the risks. There is no obligation to go ahead.
    - q: Do you manage or invest my money?
      a: >-
        No. Savantho is a consultancy, not licensed by the Capital Markets Authority. We do not
        hold or manage client funds and we do not recommend specific securities. We help you
        understand your options and their risks; where regulated advice is needed, we refer
        you to a CMA-licensed adviser.
    - q: Can you help us find Shariah-compliant options?
      a: >-
        Yes. We explain how Shariah-compliant structures work and how they are screened: no
        interest (riba), no excessive uncertainty (gharar), no speculation (maysir), backed by
        real assets and limited to ethical sectors. We help you weigh the options and their
        risks; the decision stays yours.
    - q: Can you help my business finance its imports?
      a: >-
        Yes. We help importers and SMEs understand and structure trade finance, including
        letters of credit, documentary collections and supplier credit. We prepare you for the
        conversation with your bank, so the terms, costs and risks are clear before you sign
        anything.

